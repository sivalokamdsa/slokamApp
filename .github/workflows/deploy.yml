name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./ci.db

  deploy:
    name: Upload and restart on VPS
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      # Upload the source. .env and the SQLite database are excluded so a deploy
      # never overwrites production secrets or data. Excluded files are also
      # protected from --delete.
      - name: Upload files with rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p $VPS_PORT -i ~/.ssh/deploy_key" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'prisma/*.db' \
            --exclude 'prisma/*.db-journal' \
            ./ "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"

      # Install, migrate the schema, build, and restart on the server.
      # bash -l loads the login profile so npm and pm2 are on PATH.
      - name: Install, build and restart
        run: |
          ssh -p "$VPS_PORT" -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            bash -l -s -- "$VPS_APP_DIR" <<'REMOTE'
          set -euo pipefail
          APP_DIR="$1"
          cd "$APP_DIR"
          npm ci
          npx prisma generate
          npx prisma db push --skip-generate
          npm run build
          pm2 startOrRestart ecosystem.config.cjs --env production
          pm2 save
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
