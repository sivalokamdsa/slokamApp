name: Deploy FDE Prep Tracker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fde
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Lint, build and deploy
    runs-on: ubuntu-latest
    environment: production

    # Build settings. The build does not write to the database.
    env:
      DATABASE_URL: file:./ci.db
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      APP_NAME: ${{ vars.APP_NAME || 'slokam' }}
      APP_PORT: ${{ vars.APP_PORT || '3000' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      # Lint, build, package only the release files, upload them, and restart
      # the app on the server. The same script works on your own machine.
      - name: Build and deploy
        run: ./scripts/deploy.sh

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
