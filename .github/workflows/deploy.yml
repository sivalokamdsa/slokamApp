name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./ci.db

  deploy:
    name: Upload and restart on VPS
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # Upload the source code. The server's .env and database are excluded so a
      # deploy never overwrites production data or secrets.
      - name: Upload files with rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }} -i ~/.ssh/deploy_key" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'prisma/*.db' \
            --exclude 'prisma/*.db-journal' \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/"

      # Install, migrate the schema, build, and restart the app on the server.
      - name: Install, build and restart
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          cd "${{ secrets.VPS_APP_DIR }}"
          npm ci
          npx prisma generate
          npx prisma db push --skip-generate
          npm run build
          pm2 restart slokam || pm2 start npm --name slokam -- start -- -p 3000
          pm2 save
          EOF

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
