name: Deploy profile site to VPS

on:
  push:
    branches: [main]
    paths:
      - "**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "**"
          target: ${{ secrets.VPS_PATH }}
        #   strip_components: 3 # strips "sites/profile" so files land directly in the target folder, not nested
